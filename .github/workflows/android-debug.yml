name: Native Android Build

on:
  push:
    branches:
      - native-android
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches:
      - native-android
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-build-v2
  cancel-in-progress: true

jobs:
  build:
    name: Compile native Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK components
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi "Received status code 429|HTTP 5[0-9][0-9]|Could not GET" build.log; then
              exit "$status"
            fi
            echo "Dependency repository throttled or unavailable; retry $attempt/3"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miowatery-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
